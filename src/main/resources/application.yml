server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: gnsw-backend
    datasource:
    # Use Supabase database (shared remote) as primary, local Postgres as fallback
    url: ${DATABASE_URL:jdbc:postgresql://aws-0-eu-west-1.pooler.supabase.com:6543/postgres?user=postgres.wniithuksxbmmgqsyseu&password=zmQaAMWaZdzYXkNb&sslmode=require&prepareThreshold=0}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 60000
      idle-timeout: 300000
      max-lifetime: 600000
      leak-detection-threshold: 60000

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: ${JPA_SHOW_SQL:true}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
    # The shared Supabase DB also runs migrations (V7/V8) from the remote
    # deployment that are not present in this repo. Skip migrate-time
    # validation so startup doesn't fail on the missing local files.
    validate-on-migrate: false
    locations: classpath:db/migration
    # When false, Flyway will NOT abort startup if an already-applied migration's
    # checksum no longer matches the file on disk (e.g. a V9 file that was edited
    # after deployment, or a CRLF/LF line-ending change). The migration is not
    # re-run; it just skips validation so the app can boot. After you run a proper
    # `flyway repair` against the DB, you can set this back to true via
    # SPRING_FLYWAY_VALIDATE_ON_MIGRATE=true.
    validate-on-migrate: ${SPRING_FLYWAY_VALIDATE_ON_MIGRATE:false}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  jackson:
    serialization:
      write-dates-as-timestamps: false
    date-format: yyyy-MM-dd'T'HH:mm:ss'Z'
    time-zone: UTC

  # File Upload Configuration
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 50MB

# JWT & Frontend Configuration
app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970337336763979244226452948404D635166546A576E5A7234753778214125442A47}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  subscription:
    # Days a member stays entitled after their renewal charge fails before we
    # mark the subscription "expired" (shown Inactive in admin, access lost).
    grace-days: ${SUBSCRIPTION_GRACE_DAYS:5}
    # Nightly cron (UTC) that moves past-due/cancelled subscriptions to expired.
    reconcile-cron: ${SUBSCRIPTION_RECONCILE_CRON:0 15 2 * * *}
  frontend:
    member-portal-url: ${MEMBER_PORTAL_URL:http://localhost:5175}
    main-site-url: ${MAIN_SITE_URL:http://localhost:5173}
    admin-url: ${ADMIN_URL:http://localhost:5174}
  mail:
    # Brevo REST API (not SMTP — Railway blocks outbound SMTP on free/hobby plans)
    brevo-api-key: ${BREVO_API_KEY:}
    sender-email: ${MAIL_SENDER_EMAIL:}
    sender-name: ${MAIL_SENDER_NAME:GNSW}
  upload:
    dir: uploads

# Paystack Configuration
paystack:
  secret-key: ${PAYSTACK_SECRET_KEY:}
  public-key: ${PAYSTACK_PUBLIC_KEY:}
  plans:
    affiliate: ${PAYSTACK_PLAN_AFFILIATE:PLN_1byzk8lwws9isbf}
    associate: ${PAYSTACK_PLAN_ASSOCIATE:PLN_39yqfw5hesewf23}
    member: ${PAYSTACK_PLAN_MEMBER:PLN_qogwva8tmxbyf4d}

# Logging
logging:
  level:
    com.gnsw: ${LOG_LEVEL_COM_GNSW:DEBUG}
    org.springframework.security: ${LOG_LEVEL_SECURITY:INFO}